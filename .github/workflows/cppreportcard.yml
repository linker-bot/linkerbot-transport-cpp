name: C++ Report Card

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      analysis_jobs:
        description: Analyzer concurrency (2 for baseline, 4 for comparison)
        type: choice
        options: ['2', '4']
        default: '4'

permissions:
  contents: read

concurrency:
  group: cppreportcard-${{ github.ref }}-${{ inputs.analysis_jobs || '4' }}
  cancel-in-progress: true

env:
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 500M

jobs:
  report:
    name: Full report (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore analysis compiler cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/transport-ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-report-clang18-libstdcxx-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-report-clang18-libstdcxx-
      - name: Record bounded analysis concurrency
        env:
          REQUESTED_JOBS: ${{ inputs.analysis_jobs || '4' }}
        run: python3 ci/analysis/configure-jobs.py --jobs "$REQUESTED_JOBS" --output build/analysis-benchmark
      - name: Install build and analysis tools
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/transport-ccache" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache build-essential cmake ninja-build clang-18 clang-format-18 clang-tidy-18 cppcheck python3-dev
      - name: Configure and build analysis inputs
        id: analysis_inputs
        run: |
          cmake -S . -B build/report -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DLINKERBOT_TRANSPORT_BUILD_TESTS=ON -DLINKERBOT_TRANSPORT_BUILD_EXAMPLES=ON \
            -DLINKERBOT_TRANSPORT_BUILD_BENCHMARKS=ON -DLINKERBOT_PERF_BUILD_STRESS=ON
          cmake --build build/report --parallel 4
          cmake --install build/report --prefix "$PWD/build/report-install"
          cmake -S examples/quickstart -B build/report-quickstart -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_PREFIX_PATH="$PWD/build/report-install"
          cmake --build build/report-quickstart --parallel 4
          cmake -S validation/installed-consumer -B build/report-consumer -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_PREFIX_PATH="$PWD/build/report-install"
          cmake --build build/report-consumer --parallel 4
          cmake -S validation/shared-consumer -B build/report-shared-consumer -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_PREFIX_PATH="$PWD/build/report-install"
          cmake --build build/report-shared-consumer --parallel 4
          ctest --test-dir build/report-shared-consumer --output-on-failure --no-tests=error
          cmake -S validation/python-preintegration -B build/report-python-proof -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPython3_EXECUTABLE=/usr/bin/python3 \
            -DCMAKE_PREFIX_PATH="$PWD/build/report-install"
          cmake --build build/report-python-proof --parallel 4
          ctest --test-dir build/report-python-proof --output-on-failure --no-tests=error
          clang++-18 -dM -E -x c++ /dev/null > build/report-target-macros.txt
          # Cppcheck does not traverse Debian's pyconfig.h -> pyconfig.h include.
          # Read the actual installed target config before its forwarding header.
          python_config="$(python3 -c 'import sysconfig; print("/usr/include/" + sysconfig.get_config_var("MULTIARCH") + "/python" + sysconfig.get_python_version() + "/pyconfig.h")')"
          test -f "$python_config"
          echo "CPPCHECK_TARGET_CONFIG=$python_config" >> "$GITHUB_ENV"
          python3 validation/prepare-report-db.py \
            --target-macros build/report-target-macros.txt \
            --output build/report-compile-commands.json \
            build/report/compile_commands.json \
            build/report-quickstart/compile_commands.json \
            build/report-consumer/compile_commands.json \
            build/report-shared-consumer/compile_commands.json \
            build/report-python-proof/compile_commands.json
      - name: Verify test-framework analysis model
        run: |
          python3 validation/test-cppcheck-model.py --compile-commands build/report-compile-commands.json
          python3 validation/test-quality-report.py
          python3 validation/test-prepare-report-db.py
      - name: Generate quality report
        # Keep diagnostic artifacts available when a model sentinel fails.
        # The failed sentinel still fails the job and prevents the A+ gate.
        if: ${{ !cancelled() && steps.analysis_inputs.outcome == 'success' }}
        uses: soulteary/cppreportcard-action@9458d052f286c576d557c34d8ad43096cedbf561 # v1.0.2
        with:
          mode: full
          config: build/analysis-benchmark/config.json
          compile_commands: build/report-compile-commands.json
          output_dir: .github/cppreportcard
          install_tools: 'false'
          fail_on: findings
          threshold: '0'
          commit: 'false'
      - name: Require a complete A+ report
        run: python3 validation/check-quality-report.py .github/cppreportcard/report.json
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cppreportcard-ubuntu-24.04-arm
          path: |
            build/analysis-benchmark/
            .github/cppreportcard/report.json
            .github/cppreportcard/report.md
            .github/cppreportcard/badge.svg
            build/report-python-proof/evidence.json
          include-hidden-files: true
          if-no-files-found: warn
